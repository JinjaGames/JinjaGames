# Futbol sitesinin (jinjagames.com/football/) verisini her gece Türkiye saatiyle 00.00'da günceller: maç sonuçları, günün haberleri, kadrolar,
# sakatlıklar, transferler, teknik direktör/başkan/sahip değişiklikleri. Son güncellemeden bu yana ne değiştiyse onu alır; eski sezonlara
# ham veri değişmedikçe dokunmaz. CurseForge iş akışından (curseforge-stats.yml) bağımsızdır: ayrı grup, ayrı dosyalar.
# ZAMANLAMA: GitHub zamanlanmış işleri dakikasında başlatmaz; bu depoda 21:05 UTC'ye kurulu çalışmalar gerçekte 00:25-00:45 UTC'de (yaklaşık 3,5 saat geç,
# Türkiye saatiyle ~03:30) başladı. Bu yüzden asıl çalışma 17:37 UTC'ye (20:37 TSİ) kuruldu: tipik gecikmeyle gece yarısı civarında biter.
# İkinci çalışma (21:47 UTC) güvence: gecikme olmazsa 00:47 TSİ'de, olursa sabaha doğru çalışır; gün sonunda biten geç maçları tamamlar.
# Güncelleme artımlıdır: ikinci çalışmada yeni bir şey yoksa commit atılmaz. CurseForge iş akışı (curseforge-stats.yml) :00'da çalıştığı için dakikalar farklı seçildi.
# Elle çalıştırmak: Actions > "Football güncelle" > Run workflow.
name: Football güncelle

on:
  schedule:
    - cron: "37 17 * * *"
    - cron: "47 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: football-update
  cancel-in-progress: false

env:
  WIF_BUILT: ${{ github.workspace }}/football/data              # derlenmiş veri doğrudan sitenin klasörüne yazılır (MUTLAK yol: alt süreçler başka klasörde çalışır)
  WIF_LAST: ${{ github.workspace }}/tools/football/last         # güncellemeler arası durum depoda tutulur (önbellek silinse de kaybolmaz)
  WIF_RAW: ${{ github.workspace }}/.football-raw   # indirilen ham veri (depoya girmez)
  PYTHONIOENCODING: utf-8

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/football/requirements.txt

      - run: pip install -r tools/football/requirements.txt

      # Ham veri (değişmeyen Transfermarkt dosyaları) önbelleğe alınır; silinirse yeniden indirilir.
      - name: Ham veri önbelleği
        uses: actions/cache@v4
        with:
          path: .football-raw
          key: football-raw-v1-${{ github.run_id }}
          restore-keys: football-raw-v1-

      - name: Güncelle (artımlı)
        id: upd
        env:
          WIF_COMMIT_MSG: ${{ runner.temp }}/football_commit.txt   # update.py anlamlı bir commit mesajı yazar (runner bağlamı iş düzeyindeki env'de KULLANILAMAZ, adım düzeyinde olmalı)
        run: python tools/football/pipeline/update.py
        continue-on-error: true      # yazılabilen veri yine commit edilsin; hata aşağıda işi kırmızıya çevirir

      - name: Değiştiyse siteye işle
        env:
          WIF_COMMIT_MSG: ${{ runner.temp }}/football_commit.txt
        run: |
          git config user.name "jinjagames-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football tools/football/last
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            if [ -s "$WIF_COMMIT_MSG" ]; then git commit -F "$WIF_COMMIT_MSG"; else git commit -m "Football: günlük güncelleme $(date -u +%Y-%m-%d)"; fi
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              sleep 5
            done
          fi

      - name: Güncelleme adımı başarısızsa işi kırmızı bitir
        if: steps.upd.outcome == 'failure'
        run: |
          echo "::error::Güncelleme betiği hata verdi; yukarıdaki 'Güncelle (artımlı)' günlüğüne bak. Başarısız adımlar bir sonraki çalışmada yeniden denenir."
          exit 1
