# JinjaQuiz: günde bir kez YouTube izlenme sayılarını (sıralama quizleri) ve anime openinglerini toplar.
# YouTube Data API anahtarı depo sırlarında YT_API_KEY adıyla durur; sırrı yoksa iş hiçbir şey yapmadan biter.
name: YouTube günlük verisi

on:
  schedule:
    # YouTube kotası Pasifik gece yarısı (08:00 UTC) sıfırlanır; hemen sonrasında çalışır
    - cron: "20 8 * * *"
  workflow_dispatch:
    inputs:
      search:
        description: "Yeni arama yapılsın mı? (0 = yalnızca izlenmeleri tazele)"
        default: "1"

permissions:
  contents: write

concurrency:
  group: quiz-youtube-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: YouTube verisini topla
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_SEARCH: ${{ github.event.inputs.search || '1' }}
        run: node tools/youtube_daily.mjs

      - name: Değiştiyse siteye işle
        run: |
          git config user.name "jinjagames-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quiz/data/rank-yt.json quiz/data/anime-ops.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "JinjaQuiz: YouTube izlenmeleri ve anime openingleri güncellendi"
            git pull --rebase --autostash
            git push
          fi
