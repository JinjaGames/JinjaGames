# JinjaAstro: haftalık ve aylık burç yorumlarını gökyüzü hesaplarından üretir.
# Her gece Türkiye saatiyle 00.10'da çalışır; dosya yalnızca yeni hafta (pazartesi) ya da yeni ay başladığında değişir.
name: Astro yorumları

on:
  schedule:
    - cron: "10 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: astro-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Yorumları üret
        run: node tools/astro_forecast.mjs

      - name: Değiştiyse siteye işle
        run: |
          git config user.name "jinjagames-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astro/data/forecast.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "JinjaAstro: haftalık ve aylık yorumlar güncellendi"
            git pull --rebase --autostash
            git push
          fi
