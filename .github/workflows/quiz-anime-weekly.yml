# JinjaQuiz anime soru havuzunu haftada bir genişletir: AniList'ten o hafta popüler animelerden yeni sorular
# eklenir, eski sorular korunur (quiz başına en fazla 800; dolunca en eskiler çıkar).
name: Anime soru havuzu

on:
  schedule:
    - cron: "20 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: quiz-anime-weekly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: AniList'ten yeni soruları topla
        run: node tools/build_anime.mjs

      - name: Değiştiyse siteye işle
        run: |
          git config user.name "jinjagames-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quiz/data/anime-*.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "JinjaQuiz: anime soru havuzu güncellendi"
            git pull --rebase --autostash
            git push
          fi
